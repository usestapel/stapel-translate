[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-translate"
version = "0.7.1"
description = "AI-powered content translation Django app for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "translation", "i18n", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # >=0.15.5 was the API floor: stapel_core.django.peers
    # (get_with_path_discovery / PathResolver / PeerRouteUnavailable), which
    # both key collectors import unconditionally. Still true, and still the
    # oldest core this package can import against.
    #
    # Raised to >=0.24.0 by the TRANS-06 permission model this release ships.
    # `is_privileged_user` (permissions.py) reads `user.is_staff` /
    # `user.is_superuser` and returns ALL_LANGUAGES — the one path that is
    # not bounded by a translator's `allowed_languages` scope. Before core
    # 0.24.0, `JWT_CREATE_USERS_FROM_TOKEN` defaulted to True, which
    # materialised unknown users locally AND replaced `is_staff` /
    # `is_superuser` from the token's claims on every request. So on an older
    # core, "empty scope grants nothing" is bypassed by any token asserting
    # is_staff, and the scope model is decorative. 0.24.0 makes the local
    # database authoritative by default; a service that genuinely consumes an
    # external identity source sets the flag and says so.
    "stapel-core>=0.24.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-translate"
Repository = "https://github.com/usestapel/stapel-translate"
Documentation = "https://github.com/usestapel/stapel-translate#readme"
Changelog = "https://github.com/usestapel/stapel-translate/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-translate/issues"

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
# Screenshot uploads are only fully validated (real decode, pixel/dimension
# caps) when a decoder is present — install this wherever the Figma plugin
# endpoints are reachable.
images = ["Pillow>=10"]
all = ["stapel-translate[kafka,images]"]

[tool.setuptools]
package-dir = {"stapel_translate" = "."}
packages = [
    "stapel_translate",
    "stapel_translate.management",
    "stapel_translate.management.commands",
    "stapel_translate.migrations",
    "stapel_translate.templatetags",
]

[tool.setuptools.package-data]
stapel_translate = ["py.typed", "migrations/*.py", "schemas/**/*.json", "templates/**/*", "migrations/**/*.py", "fixtures/builtin/*.json", "translations/*.json", "translations/.state.json", "docs/capabilities.json", "docs/schema.json", "docs/flows.json", "docs/errors.json", "docs/llms.txt", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
